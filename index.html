<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 学习指南</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #6c5ce7;
    }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    }
    .markdown-section {
      max-width: 900px;
    }
    .markdown-section h1 {
      border-bottom: 3px solid var(--theme-color);
      padding-bottom: 12px;
    }
    .markdown-section h2 {
      border-left: 5px solid var(--theme-color);
      padding-left: 10px;
    }
    .markdown-section pre {
      background: #2d3436;
    }
    .markdown-section pre code {
      color: #dfe6e9;
      background: transparent;
    }
    .markdown-section code {
      color: #c0392b;
      background: #f4f4f8;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .markdown-section th {
      background: var(--theme-color);
      color: white;
    }
    .markdown-section blockquote {
      border-left: 4px solid #74b9ff;
      background: #f0f7ff;
    }
    nav.app-nav {
      background: #fff;
    }
    .sidebar {
      padding-top: 20px;
    }
    .sidebar-nav h2 {
      color: var(--theme-color);
    }

    /* 封面页样式 */
    .cover.show {
      background: linear-gradient(135deg, #6c5ce7 0%, #0984e3 50%, #00b894 100%);
      color: #fff;
    }
    .cover.show h1 {
      font-size: 56px;
      font-weight: 700;
      letter-spacing: 2px;
      border: none;
      padding: 0;
      margin-bottom: 24px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.2);
    }
    .cover.show h1::after {
      content: '';
      display: block;
      width: 80px;
      height: 4px;
      background: #fff;
      margin: 16px auto 0;
      border-radius: 2px;
    }
    .cover.show blockquote {
      color: rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.1);
      border-left: 4px solid rgba(255,255,255,0.6);
      padding: 10px 20px;
      border-radius: 4px;
      margin: 16px 0;
    }
    .cover.show blockquote p {
      margin: 4px 0;
    }
    .cover.show ul {
      list-style: none;
      padding: 0;
      margin: 24px 0;
    }
    .cover.show ul li {
      padding: 6px 0;
      font-size: 16px;
      color: rgba(255,255,255,0.95);
    }
    .cover.show img {
      margin: 8px 4px;
      height: 22px;
      vertical-align: middle;
    }
    .cover.show a {
      color: #fff;
      text-decoration: none;
      border: 2px solid rgba(255,255,255,0.8);
      padding: 10px 24px;
      margin: 8px;
      border-radius: 24px;
      display: inline-block;
      font-weight: 600;
      transition: all 0.2s;
      background: rgba(255,255,255,0.1);
    }
    .cover.show a:hover {
      background: rgba(255,255,255,0.9);
      color: #6c5ce7;
    }
    .cover.show p {
      color: rgba(255,255,255,0.95);
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'Agent 学习指南',
      repo: 'Mackbin/agentPython',
      loadSidebar: true,
      subMaxLevel: 3,
      coverpage: true,
      search: {
        placeholder: '搜索',
        noData: '无结果',
        depth: 3
      },
      auto2top: true,
      themeColor: '#6c5ce7',
      footer: {
        copy: '<span>基于 autobots & agplateform 项目实战</span>',
        pre: '<hr/>',
        auth: '2026'
      },
      copyCode: {
        buttonText: '复制',
        errorText: '错误',
        successText: '已复制'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
</body>
</html>
