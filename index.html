<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 学习指南</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #6c5ce7;
    }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    }
    .markdown-section {
      max-width: 900px;
    }
    .markdown-section h1 {
      border-bottom: 3px solid var(--theme-color);
      padding-bottom: 12px;
    }
    .markdown-section h2 {
      border-left: 5px solid var(--theme-color);
      padding-left: 10px;
    }
    .markdown-section pre {
      background: #2d3436;
    }
    .markdown-section pre code {
      color: #dfe6e9;
      background: transparent;
    }
    .markdown-section code {
      color: #c0392b;
      background: #f4f4f8;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .markdown-section th {
      background: var(--theme-color);
      color: white;
    }
    .markdown-section blockquote {
      border-left: 4px solid #74b9ff;
      background: #f0f7ff;
    }
    nav.app-nav {
      background: #fff;
    }
    .sidebar {
      padding-top: 20px;
    }
    .sidebar-nav h2 {
      color: var(--theme-color);
    }

    /* ============ 封面页样式(精确覆盖 docsify 默认样式) ============ */
    /* docsify 会动态注入背景渐变 inline,且 h1/按钮有默认样式,全部用高特异性 + !important 覆盖 */

    section.cover.show {
      background: linear-gradient(160deg, #0f2027 0%, #203a43 50%, #2c5364 100%) !important;
    }

    section.cover.show .cover-main {
      max-width: 820px;
    }

    /* 主标题:大号白色粗体,去掉 docsify 默认的白底圆角框 */
    section.cover.show .cover-main h1 {
      font-size: 62px !important;
      font-weight: 800 !important;
      letter-spacing: 3px !important;
      color: #fff !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 24px 0 8px !important;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.35);
    }
    section.cover.show .cover-main h1 a {
      color: #fff !important;
      background: transparent !important;
      text-decoration: none;
    }

    /* 副标题(blockquote) */
    section.cover.show .cover-main blockquote {
      color: rgba(255, 255, 255, 0.82) !important;
      background: transparent !important;
      border: none !important;
      font-size: 20px !important;
      line-height: 1.7 !important;
      padding: 8px 0 4px !important;
      margin: 0 auto 12px !important;
    }
    section.cover.show .cover-main blockquote p {
      color: rgba(255, 255, 255, 0.82) !important;
      margin: 4px 0 !important;
    }

    /* 分隔线 */
    section.cover.show .cover-main hr {
      border: none !important;
      height: 1px !important;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent) !important;
      margin: 20px auto !important;
      width: 60% !important;
    }

    /* 说明文字段落 */
    section.cover.show .cover-main p {
      color: rgba(255, 255, 255, 0.9) !important;
      font-size: 16px !important;
      line-height: 1.8 !important;
    }

    /* 特性列表 */
    section.cover.show .cover-main ul {
      list-style: none !important;
      padding: 0 !important;
      margin: 20px 0 28px !important;
    }
    section.cover.show .cover-main ul li {
      padding: 7px 0 !important;
      font-size: 16px !important;
      color: rgba(255, 255, 255, 0.92) !important;
      line-height: 1.7 !important;
    }
    section.cover.show .cover-main ul li::before {
      content: '✦';
      color: #74b9ff;
      margin-right: 10px;
      font-size: 14px;
    }

    /* 徽章(badge 图片) */
    section.cover.show .cover-main img {
      height: 22px !important;
      margin: 4px 5px !important;
      vertical-align: middle !important;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 8px;
      border-radius: 999px;
    }

    /* 按钮:胶囊白边按钮(精确匹配 docsify 的选择器) */
    section.cover.show .cover-main > p:last-child a {
      border: 2px solid rgba(255, 255, 255, 0.65) !important;
      border-radius: 999px !important;
      color: #fff !important;
      background: rgba(255, 255, 255, 0.06) !important;
      display: inline-block !important;
      font-size: 1.05rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.05em !important;
      margin: 0.6em 0.8em !important;
      padding: 0.8em 2.2em !important;
      text-decoration: none !important;
      transition: all 0.2s ease !important;
    }
    /* 最后一个按钮(主要 CTA):主题色实心 */
    section.cover.show .cover-main > p:last-child a:last-child {
      background: #6c5ce7 !important;
      border-color: #6c5ce7 !important;
    }
    section.cover.show .cover-main > p:last-child a:hover {
      background: #fff !important;
      border-color: #fff !important;
      color: #2c5364 !important;
      transform: translateY(-2px) !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35) !important;
    }

    /* 底部版权角标 */
    section.cover.show::after {
      content: 'Agent 学习指南 · 基于 autobots & agplateform 项目实战 · 2026';
      position: absolute;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    window.$docsify = {
      name: 'Agent 学习指南',
      repo: 'Mackbin/agentPython',
      loadSidebar: true,
      subMaxLevel: 3,
      coverpage: true,
      search: {
        placeholder: '搜索',
        noData: '无结果',
        depth: 3
      },
      auto2top: true,
      themeColor: '#6c5ce7',
      footer: {
        copy: '<span>Autobots / agplateform 学习资料库</span>',
        pre: '<hr/>',
        auth: '2026'
      },
      copyCode: {
        buttonText: '复制',
        errorText: '错误',
        successText: '已复制'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
</body>
</html>
